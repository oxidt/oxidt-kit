[package]
name = "oxidt-agent-setup"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The response contract for agent-driven setup over MCP — what a setup tool hands back (resource, env vars, install snippets, steps only a human can do) and what a verify tool reports"

[dependencies]
serde.workspace = true
chrono.workspace = true
# rmcp derives tool output schemas through schemars 1.x; every consumer already
# links it, so the derive is not feature-gated.
schemars = { version = "1.0", features = ["chrono04"] }

[dev-dependencies]
serde_json.workspace = true
