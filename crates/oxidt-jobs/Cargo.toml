[package]
name = "oxidt-jobs"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable, at-least-once Postgres job queue: SKIP LOCKED claims, fenced leases, priority, backoff and a worker pool over an app-supplied handler"

[dependencies]
# The one Postgres crate in the kit: the queue is the SQL.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
tracing = "0.1"
oxidt-monitor = { path = "../oxidt-monitor", version = "0.1", optional = true }

[features]
# `Stats::kpis`, for apps reporting to the board through oxidt-monitor.
monitor = ["dep:oxidt-monitor"]

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["migrate"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
