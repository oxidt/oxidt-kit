[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]
license = "MIT"
repository = "https://github.com/oxidt/oxidt-kit"

[workspace.dependencies]
base64 = "0.22"
secrecy = "0.10"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
