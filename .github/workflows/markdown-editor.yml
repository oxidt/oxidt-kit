name: Markdown editor

on:
  push:
    paths: ["crates/oxidt-markdown-editor/**", ".github/workflows/markdown-editor.yml"]
  pull_request:
    paths: ["crates/oxidt-markdown-editor/**", ".github/workflows/markdown-editor.yml"]

jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/oxidt-markdown-editor
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run test:editor
      - run: bun run build:editor
      - run: git diff --exit-code -- assets/markdown-editor.js
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: cargo clippy --features topcoat --all-targets -- -D warnings
      - run: cargo clippy --features dioxus --target wasm32-unknown-unknown -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: topcoat-cli@0.10.0
      - run: topcoat fmt --check --rustfmt src/topcoat.rs
